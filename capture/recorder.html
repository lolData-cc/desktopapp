<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>loldata capture</title>
  </head>
  <body style="margin:0;background:#000">
    <script type="module">
      /**
       * The recorder.
       *
       * Lives in its own invisible window, and that is the design rather than a
       * convenience: MediaRecorder is a DOM API, so this has to be a renderer —
       * and putting it in the MAIN window would tie a twenty-minute recording to
       * whatever that window is doing. A section change, a 3D scene, a React
       * error: none of them can touch a recording that has its own process.
       *
       * ⚠️ Chunks go to the shell as they arrive and are appended to a file
       * there. Holding a whole game in memory as Blobs is a gigabyte of RAM for
       * something that belongs on disk, and it loses everything if the app dies.
       * At one chunk a second, a crash costs one second.
       *
       * ⚠️ H264 by preference. It is the codec with hardware encoding on
       * essentially every GPU, which is the whole difference between "no FPS
       * lost" and a recorder that competes with the game it is recording. VP9
       * is software-encoded here and would do exactly that.
       *
       * ⚠️ MP4 FIRST, and that is about what happens AFTER the game.
       *
       * A MediaRecorder WebM carries no duration in its header — every player
       * that opens one, ours included, has to read the whole file to find out
       * how long it is, and a one-gigabyte game makes that a visible wait.
       * Windows' own player shows such a file as broken. The MP4 our recorder
       * writes states its length up front and opens anywhere, which for a clip
       * somebody saves to keep is the difference between a video and a
       * curiosity. Both were measured here; both seek correctly.
       */
      const { ipcRenderer } = require("electron")

      const CODECS = [
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
        "video/webm;codecs=h264,opus",
        "video/webm;codecs=vp8,opus",
      ]

      let mixer = null
      let meters = null
      let lastPeaks = null
      let micInGraph = null
      let recorder = null
      let stream = null
      /** Chunks read but not yet handed to the shell. */
      let inflight = new Set()

      const pick = () => CODECS.find((t) => MediaRecorder.isTypeSupported(t)) ?? ""

      async function start({ sourceId, audio, layout, fps, bitrate, mic }) {
        await stop()

        // The graph that mixes the microphone into the system audio, when both
        // are wanted. Held so it can be torn down with the recording.
        mixer = null

        // ⚠️ In split mode the system MIX is exactly what we do not want: the
        // whole point is two programmes kept apart, and the mix is both of them
        // already blended past separating.
        micInGraph = null
        const split = layout === "split"
        const wantsSystem = !split && (audio === "system" || audio === "both")
        // ⚠️ INDEPENDENT of `audio` now. It used to be two members of that
        // list, which made "record my voice" and "record the machine" one
        // question with no answer that meant both.
        const wantsMic = !!mic?.on

        // The desktop video track, and the system mix alongside it when asked.
        // ⚠️ Loopback audio has to be requested in the SAME getUserMedia call as
        // the desktop video; asked for on its own, Chromium has no surface to
        // attach it to and fails.
        stream = await navigator.mediaDevices.getUserMedia({
          audio: wantsSystem ? { mandatory: { chromeMediaSource: "desktop" } } : false,
          video: {
            mandatory: {
              chromeMediaSource: "desktop",
              chromeMediaSourceId: sourceId,
              // ⚠️ A MINIMUM as well as a maximum, and this is not a quality
              // setting — it is what keeps the video's clock and the wall
              // clock the same clock.
              //
              // The desktop capturer only emits a frame when the screen
              // changes, so a recording of a still picture ends at its last
              // frame: fifteen seconds of wall time came back as a ten-second
              // video. Every kill we mark is timestamped against the wall
              // clock, so any gap between the two is a jump that lands in the
              // wrong place — and it grows for the rest of the game.
              minFrameRate: fps,
              maxFrameRate: fps,
            },
          },
        })

        if (split) {
          /**
           * ⚠️ ONE AT A TIME, and each preceded by asking the shell to arm it.
           * The shell answers the NEXT getDisplayMedia call with one process id
           * and disarms itself; two calls in flight would be answered in
           * whichever order Chromium made them, and the game's audio would land
           * on the channel labelled Discord with nothing reporting it.
           */
          const grab = async (kind) => {
            const armed = await ipcRenderer.invoke("capture:want-audio", kind)
            if (!armed) return null
            try {
              return await navigator.mediaDevices.getDisplayMedia({
                video: false,
                /**
                 * ⚠️ ALL THREE OFF, and this is not tidiness. With the defaults
                 * Chromium runs echo cancellation, auto gain and noise
                 * suppression over a LOOPBACK capture — measured, a steady tone
                 * decayed 16 dB in four seconds. They exist for microphones;
                 * on a program's own output they are damage.
                 */
                audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false },
              })
            } catch (e) {
              ipcRenderer.send("capture:warn", kind + " audio unavailable: " + String(e).slice(0, 120))
              return null
            }
          }

          const game = await grab("game")
          const voice = await grab("voice")

          if (game && voice) {
            /**
             * The two programmes, merged into ONE STEREO TRACK: game LEFT,
             * Discord RIGHT.
             *
             * ⚠️ One track, because MediaRecorder writes exactly one and keeps
             * the FIRST — measured on this build, a stream with two audio tracks
             * produces a file with one, silently. A stereo track is the only
             * shape that carries two programmes through it, and the player
             * splits the channels back apart on the way out.
             */
            const ctx = new AudioContext()
            const merger = ctx.createChannelMerger(2)
            const dest = ctx.createMediaStreamDestination()

            const arm = (s, input) => {
              const src = ctx.createMediaStreamSource(s)
              // Forced to ONE channel: a stereo source fed into one merger input
              // would be downmixed anyway, and saying so explicitly is the
              // difference between a decision and a default.
              const mono = ctx.createGain()
              mono.channelCount = 1
              mono.channelCountMode = "explicit"
              mono.channelInterpretation = "speakers"
              src.connect(mono)
              mono.connect(merger, 0, input)
              // ⚠️ The only way to know this worked. A loopback pointed at the
              // wrong process is a LIVE track of digital silence — no error, no
              // console output — so the question has to be asked of the signal.
              const an = ctx.createAnalyser()
              an.fftSize = 512
              mono.connect(an)
              return an
            }

            const anGame = arm(game, 0)
            const anVoice = arm(voice, 1)

            /**
             * ⚠️ YOUR OWN VOICE JOINS THE CHAT CHANNEL, and it has to join the
             * graph HERE rather than through the mixing path below. That path
             * folds whatever audio tracks the stream already has into one
             * destination - which would collapse the stereo track this just
             * built, and the two programmes with it.
             *
             * Chat rather than centred: turning the chat rail down in the replay
             * should quieten the conversation, and your half of a conversation
             * is part of it. Centred it would be the one voice you cannot lower
             * while lowering the others.
             */
            if (wantsMic) {
              try {
                const own = await navigator.mediaDevices.getUserMedia({
                  audio: mic?.deviceId ? { deviceId: { ideal: mic.deviceId } } : true,
                })
                const g = ctx.createGain()
                g.gain.value = typeof mic?.volume === "number" ? mic.volume : 1
                ctx.createMediaStreamSource(own).connect(g)
                g.connect(merger, 0, 1)
                micInGraph = own
              } catch (e) {
                ipcRenderer.send("capture:warn", "microphone unavailable: " + String(e).slice(0, 120))
              }
            }

            merger.connect(dest)

            // Electron's default autoplay policy does not require a gesture, but
            // a suspended context would record silence, so it is not assumed.
            try { await ctx.resume() } catch {}
            if (ctx.state !== "running") {
              ipcRenderer.send("capture:warn", "audio context did not start: " + ctx.state)
            }

            dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t))
            mixer = {
              ctx,
              mic: new MediaStream([
                ...game.getTracks(),
                ...voice.getTracks(),
                ...(micInGraph ? micInGraph.getTracks() : []),
              ]),
            }

            const buf = new Uint8Array(anGame.fftSize)
            const peak = { game: 0, voice: 0 }
            const read = (an) => {
              an.getByteTimeDomainData(buf)
              let m = 0
              for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128) / 128)
              return m
            }
            const tick = setInterval(() => {
              peak.game = Math.max(peak.game, read(anGame))
              peak.voice = Math.max(peak.voice, read(anVoice))
              /**
               * ⚠️ REPORTED AS THEY GO, not handed over at the end.
               *
               * A game ends by its WINDOW CLOSING, and the desktop capture dies
               * with it — "the target source has been closed", which arrives as
               * `capture:failed` and finishes the recording on the spot. The
               * clean `capture:stop` path, where these used to be collected,
               * therefore almost never runs in real use: every recording came
               * back with no peaks, and the player refused the second rail
               * because it could not tell a working channel from a silent one.
               */
              ipcRenderer.send("capture:peaks", peak)
            }, 2000)
            meters = { peak, tick }
          } else {
            // One of the two is missing, so there is nothing to keep apart.
            // Falls back to the mix rather than to half a recording.
            ;[game, voice].forEach((s) => s?.getTracks().forEach((t) => t.stop()))
            ipcRenderer.send("capture:warn", "split audio unavailable — recording the mix instead")
            const mix = await navigator.mediaDevices
              .getUserMedia({ audio: { mandatory: { chromeMediaSource: "desktop" } }, video: false })
              .catch(() => null)
            mix?.getAudioTracks().forEach((t) => stream.addTrack(t))
          }
        }

        if (wantsMic && !micInGraph) {
          // A separate call, because a microphone is a real device and cannot
          // ride the desktop constraint. Failure here is not fatal: a recording
          // without your voice beats no recording.
          try {
            /**
             * ⚠️ `ideal`, not `exact`. A stored device id outlives the device:
             * headsets get unplugged, and Windows renumbers them. `exact` would
             * throw and the game would record with no voice at all, which is a
             * failure that looks exactly like success. `ideal` falls back to
             * the default input, which is what the player had before they ever
             * opened this setting.
             */
            const micStream = await navigator.mediaDevices.getUserMedia({
              audio: mic?.deviceId ? { deviceId: { ideal: mic.deviceId } } : true,
            })

            /**
             * ⚠️ MIXED, not added as a second track.
             *
             * This used to be `mic.getAudioTracks().forEach((t) => stream.addTrack(t))`,
             * and the microphone was SILENTLY THROWN AWAY. MediaRecorder writes
             * exactly ONE audio track and keeps the FIRST one in the stream:
             * measured on this Electron build, a stream of one video and two
             * audio tracks produced an mp4 with 2 traks and a webm with 2
             * TrackEntry, never 3 — with no exception, no `onerror` and nothing
             * on the console. The loopback is track 0, so "Both" recorded the
             * system and dropped the voice, while the app's own log said "2
             * audio track(s)" and Preferences promised "System and microphone,
             * mixed".
             *
             * So mix them for real. Two sources into one destination is one
             * track, which is the only shape that survives.
             */
            const ctx = new AudioContext()
            const dest = ctx.createMediaStreamDestination()

            const sys = new MediaStream(stream.getAudioTracks())
            if (sys.getAudioTracks().length) ctx.createMediaStreamSource(sys).connect(dest)

            /**
             * ⚠️ The voice gets a GAIN and the machine does not, deliberately.
             * A headset microphone against game audio is usually the quiet one,
             * and the only fix a player has otherwise is Windows' own mixer —
             * so this goes above 1. The machine's level is whatever the machine
             * played; changing that would be rewriting the game's own mix.
             */
            const voice = ctx.createGain()
            voice.gain.value = typeof mic?.volume === "number" ? mic.volume : 1
            ctx.createMediaStreamSource(micStream).connect(voice)
            voice.connect(dest)

            // The originals leave the stream; the mix takes their place.
            stream.getAudioTracks().forEach((t) => stream.removeTrack(t))
            dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t))

            // ⚠️ Kept alive for the recording, and closed with it: an
            // AudioContext that goes out of scope is collected, and the mix
            // stops without a word.
            mixer = { ctx, mic: micStream }
          } catch (e) {
            ipcRenderer.send("capture:warn", "microphone unavailable: " + String(e).slice(0, 120))
          }
        }

        /**
         * ⚠️ The rate has to be asked for TWICE.
         *
         * The legacy `mandatory` block is the only way to name a capture source
         * — `chromeMediaSourceId` exists nowhere else — but Chromium hands back
         * 30fps from it whatever minFrameRate says. Measured: asking for 60
         * produced a track reporting 30. So the modern constraint is applied to
         * the track afterwards, which is the form that is actually honoured.
         *
         * Non-fatal if it fails: 30fps is a working recording, and the shell
         * records what the track ACTUALLY reports rather than what was asked,
         * so a machine that refuses says so in the library instead of lying.
         */
        const track0 = stream.getVideoTracks()[0]
        if (fps > 30 && track0) {
          try {
            await track0.applyConstraints({ frameRate: { ideal: fps, min: Math.min(fps, 50) } })
          } catch (e) {
            ipcRenderer.send("capture:warn", "could not raise the frame rate: " + String(e).slice(0, 120))
          }
        }

        const mimeType = pick()
        recorder = new MediaRecorder(stream, {
          mimeType,
          videoBitsPerSecond: bitrate,
          /**
           * ⚠️ Named, where it never used to be. The default is 128 kbps, and
           * two UNCORRELATED mono programmes in a joint-stereo frame is the
           * worst case an encoder gets — the two channels share nothing it can
           * fold together. Measured: this value is honoured almost exactly.
           */
          audioBitsPerSecond: 192000,
        })

        /**
         * ⚠️ Every chunk is tracked until it has actually been handed over.
         *
         * Reading a Blob is asynchronous, and the LAST chunk arrives on
         * dataavailable just before onstop — so a "stopped" sent the moment
         * the recorder stops overtakes it, the shell closes the file, and the
         * final second of the game is dropped on the floor. stop() waits for
         * these.
         */
        recorder.ondataavailable = (e) => {
          if (!e.data || e.data.size === 0) return
          const job = e.data
            .arrayBuffer()
            .then((buf) => ipcRenderer.send("capture:chunk", buf))
            .catch(() => undefined)
            .finally(() => inflight.delete(job))
          inflight.add(job)
        }

        recorder.onerror = (e) => {
          ipcRenderer.send("capture:failed", String(e?.error ?? e).slice(0, 200))
        }

        // One second per chunk: small enough that a crash costs a second, large
        // enough that the IPC is not the expensive part.
        recorder.start(1000)

        const track = stream.getVideoTracks()[0]
        const settings = track.getSettings()

        // The user can revoke the capture from Windows itself; if the track
        // ends we are no longer recording whatever the app believes.
        track.onended = () => ipcRenderer.send("capture:failed", "the capture was ended by the system")

        return {
          mimeType,
          width: settings.width ?? 0,
          height: settings.height ?? 0,
          fps: Math.round(settings.frameRate ?? 0),
          // ⚠️ What was actually BUILT, which is not always what was asked for:
          // a missing process or a refused stream falls back to the mix, and a
          // recording that claimed "split" while holding one mixed track would
          // send the player looking for a channel that is not there.
          layout: meters ? "split" : "stereo",
          audio: stream.getAudioTracks().length,
        }
      }

      async function stop() {
        if (recorder && recorder.state !== "inactive") {
          await new Promise((resolve) => {
            recorder.onstop = resolve
            recorder.stop()
          })
        }
        // The last second is part of the recording, not an optional extra.
        await Promise.all([...inflight])
        inflight = new Set()
        recorder = null
        // Tracks are stopped by hand: a MediaRecorder that has finished does not
        // release the capture, and a live desktop track keeps the whole pipeline
        // running for nothing.
        stream?.getTracks().forEach((t) => t.stop())
        stream = null
        if (meters) {
          clearInterval(meters.tick)
          lastPeaks = meters.peak
          meters = null
        }
        // The mix, and the device behind it. Both are stopped by hand for the
        // same reason the tracks are: nothing else releases them.
        if (mixer) {
          mixer.mic.getTracks().forEach((t) => t.stop())
          try { await mixer.ctx.close() } catch {}
          mixer = null
        }
      }

      ipcRenderer.on("capture:start", async (_e, opts) => {
        try {
          const info = await start(opts)
          ipcRenderer.send("capture:started", info)
        } catch (e) {
          ipcRenderer.send("capture:failed", String(e).slice(0, 200))
        }
      })

      ipcRenderer.on("capture:stop", async () => {
        await stop()
        ipcRenderer.send("capture:stopped", lastPeaks ? { peaks: lastPeaks } : undefined)
      })

      ipcRenderer.send("capture:ready")
    </script>
  </body>
</html>
