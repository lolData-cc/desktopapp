<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>loldata capture</title>
  </head>
  <body style="margin:0;background:#000">
    <script type="module">
      /**
       * The recorder.
       *
       * Lives in its own invisible window, and that is the design rather than a
       * convenience: MediaRecorder is a DOM API, so this has to be a renderer —
       * and putting it in the MAIN window would tie a twenty-minute recording to
       * whatever that window is doing. A section change, a 3D scene, a React
       * error: none of them can touch a recording that has its own process.
       *
       * ⚠️ Chunks go to the shell as they arrive and are appended to a file
       * there. Holding a whole game in memory as Blobs is a gigabyte of RAM for
       * something that belongs on disk, and it loses everything if the app dies.
       * At one chunk a second, a crash costs one second.
       *
       * ⚠️ H264 by preference. It is the codec with hardware encoding on
       * essentially every GPU, which is the whole difference between "no FPS
       * lost" and a recorder that competes with the game it is recording. VP9
       * is software-encoded here and would do exactly that.
       *
       * ⚠️ MP4 FIRST, and that is about what happens AFTER the game.
       *
       * A MediaRecorder WebM carries no duration in its header — every player
       * that opens one, ours included, has to read the whole file to find out
       * how long it is, and a one-gigabyte game makes that a visible wait.
       * Windows' own player shows such a file as broken. The MP4 our recorder
       * writes states its length up front and opens anywhere, which for a clip
       * somebody saves to keep is the difference between a video and a
       * curiosity. Both were measured here; both seek correctly.
       */
      const { ipcRenderer } = require("electron")

      const CODECS = [
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
        "video/webm;codecs=h264,opus",
        "video/webm;codecs=vp8,opus",
      ]

      let mixer = null
      let recorder = null
      let stream = null
      /** Chunks read but not yet handed to the shell. */
      let inflight = new Set()

      const pick = () => CODECS.find((t) => MediaRecorder.isTypeSupported(t)) ?? ""

      async function start({ sourceId, audio, fps, bitrate }) {
        await stop()

        // The graph that mixes the microphone into the system audio, when both
        // are wanted. Held so it can be torn down with the recording.
        mixer = null

        const wantsSystem = audio === "system" || audio === "both"
        const wantsMic = audio === "mic" || audio === "both"

        // The desktop video track, and the system mix alongside it when asked.
        // ⚠️ Loopback audio has to be requested in the SAME getUserMedia call as
        // the desktop video; asked for on its own, Chromium has no surface to
        // attach it to and fails.
        stream = await navigator.mediaDevices.getUserMedia({
          audio: wantsSystem ? { mandatory: { chromeMediaSource: "desktop" } } : false,
          video: {
            mandatory: {
              chromeMediaSource: "desktop",
              chromeMediaSourceId: sourceId,
              // ⚠️ A MINIMUM as well as a maximum, and this is not a quality
              // setting — it is what keeps the video's clock and the wall
              // clock the same clock.
              //
              // The desktop capturer only emits a frame when the screen
              // changes, so a recording of a still picture ends at its last
              // frame: fifteen seconds of wall time came back as a ten-second
              // video. Every kill we mark is timestamped against the wall
              // clock, so any gap between the two is a jump that lands in the
              // wrong place — and it grows for the rest of the game.
              minFrameRate: fps,
              maxFrameRate: fps,
            },
          },
        })

        if (wantsMic) {
          // A separate call, because a microphone is a real device and cannot
          // ride the desktop constraint. Failure here is not fatal: a recording
          // without your voice beats no recording.
          try {
            const mic = await navigator.mediaDevices.getUserMedia({ audio: true })

            /**
             * ⚠️ MIXED, not added as a second track.
             *
             * This used to be `mic.getAudioTracks().forEach((t) => stream.addTrack(t))`,
             * and the microphone was SILENTLY THROWN AWAY. MediaRecorder writes
             * exactly ONE audio track and keeps the FIRST one in the stream:
             * measured on this Electron build, a stream of one video and two
             * audio tracks produced an mp4 with 2 traks and a webm with 2
             * TrackEntry, never 3 — with no exception, no `onerror` and nothing
             * on the console. The loopback is track 0, so "Both" recorded the
             * system and dropped the voice, while the app's own log said "2
             * audio track(s)" and Preferences promised "System and microphone,
             * mixed".
             *
             * So mix them for real. Two sources into one destination is one
             * track, which is the only shape that survives.
             */
            const ctx = new AudioContext()
            const dest = ctx.createMediaStreamDestination()

            const sys = new MediaStream(stream.getAudioTracks())
            if (sys.getAudioTracks().length) ctx.createMediaStreamSource(sys).connect(dest)
            ctx.createMediaStreamSource(mic).connect(dest)

            // The originals leave the stream; the mix takes their place.
            stream.getAudioTracks().forEach((t) => stream.removeTrack(t))
            dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t))

            // ⚠️ Kept alive for the recording, and closed with it: an
            // AudioContext that goes out of scope is collected, and the mix
            // stops without a word.
            mixer = { ctx, mic }
          } catch (e) {
            ipcRenderer.send("capture:warn", "microphone unavailable: " + String(e).slice(0, 120))
          }
        }

        /**
         * ⚠️ The rate has to be asked for TWICE.
         *
         * The legacy `mandatory` block is the only way to name a capture source
         * — `chromeMediaSourceId` exists nowhere else — but Chromium hands back
         * 30fps from it whatever minFrameRate says. Measured: asking for 60
         * produced a track reporting 30. So the modern constraint is applied to
         * the track afterwards, which is the form that is actually honoured.
         *
         * Non-fatal if it fails: 30fps is a working recording, and the shell
         * records what the track ACTUALLY reports rather than what was asked,
         * so a machine that refuses says so in the library instead of lying.
         */
        const track0 = stream.getVideoTracks()[0]
        if (fps > 30 && track0) {
          try {
            await track0.applyConstraints({ frameRate: { ideal: fps, min: Math.min(fps, 50) } })
          } catch (e) {
            ipcRenderer.send("capture:warn", "could not raise the frame rate: " + String(e).slice(0, 120))
          }
        }

        const mimeType = pick()
        recorder = new MediaRecorder(stream, {
          mimeType,
          videoBitsPerSecond: bitrate,
        })

        /**
         * ⚠️ Every chunk is tracked until it has actually been handed over.
         *
         * Reading a Blob is asynchronous, and the LAST chunk arrives on
         * dataavailable just before onstop — so a "stopped" sent the moment
         * the recorder stops overtakes it, the shell closes the file, and the
         * final second of the game is dropped on the floor. stop() waits for
         * these.
         */
        recorder.ondataavailable = (e) => {
          if (!e.data || e.data.size === 0) return
          const job = e.data
            .arrayBuffer()
            .then((buf) => ipcRenderer.send("capture:chunk", buf))
            .catch(() => undefined)
            .finally(() => inflight.delete(job))
          inflight.add(job)
        }

        recorder.onerror = (e) => {
          ipcRenderer.send("capture:failed", String(e?.error ?? e).slice(0, 200))
        }

        // One second per chunk: small enough that a crash costs a second, large
        // enough that the IPC is not the expensive part.
        recorder.start(1000)

        const track = stream.getVideoTracks()[0]
        const settings = track.getSettings()

        // The user can revoke the capture from Windows itself; if the track
        // ends we are no longer recording whatever the app believes.
        track.onended = () => ipcRenderer.send("capture:failed", "the capture was ended by the system")

        return {
          mimeType,
          width: settings.width ?? 0,
          height: settings.height ?? 0,
          fps: Math.round(settings.frameRate ?? 0),
          audio: stream.getAudioTracks().length,
        }
      }

      async function stop() {
        if (recorder && recorder.state !== "inactive") {
          await new Promise((resolve) => {
            recorder.onstop = resolve
            recorder.stop()
          })
        }
        // The last second is part of the recording, not an optional extra.
        await Promise.all([...inflight])
        inflight = new Set()
        recorder = null
        // Tracks are stopped by hand: a MediaRecorder that has finished does not
        // release the capture, and a live desktop track keeps the whole pipeline
        // running for nothing.
        stream?.getTracks().forEach((t) => t.stop())
        stream = null
        // The mix, and the device behind it. Both are stopped by hand for the
        // same reason the tracks are: nothing else releases them.
        if (mixer) {
          mixer.mic.getTracks().forEach((t) => t.stop())
          try { await mixer.ctx.close() } catch {}
          mixer = null
        }
      }

      ipcRenderer.on("capture:start", async (_e, opts) => {
        try {
          const info = await start(opts)
          ipcRenderer.send("capture:started", info)
        } catch (e) {
          ipcRenderer.send("capture:failed", String(e).slice(0, 200))
        }
      })

      ipcRenderer.on("capture:stop", async () => {
        await stop()
        ipcRenderer.send("capture:stopped")
      })

      ipcRenderer.send("capture:ready")
    </script>
  </body>
</html>
