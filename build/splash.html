<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lolData</title>
<!--
  The boot animation.

  No panel and no background: the window is transparent and the only things
  that exist are the mark and the motion around it.

  ⚠️ EVERY animation here is on transform or opacity, and nothing else. Those
  two are the only properties a compositor can handle on its own — anything
  else drags the main thread into each frame:

    - the first version animated `width` on the converging lines, which forces
      a layout recalculation per frame
    - and `filter: blur()` on the mark, which forces a re-rasterisation per
      frame

  Both were visible as stutter, and both are gone. It matters more here than
  elsewhere because a transparent window already gives up part of the GPU path
  on Windows, so there is no headroom to waste.

  Sequence, ~1.9s:
    0ms    the mark scales up out of nothing
    120ms  the bloom passes over it
    240ms  the first ring goes out
    520ms  the radar arc makes one turn
    620ms  a second, slower ring
    760ms  LOLDATA lands letter by letter
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none; cursor: default;
    -webkit-app-region: drag;
  }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }

  /* ── the mark ──────────────────────────────────────────────────────── */
  .mark {
    position: relative;
    width: 96px; height: 96px;
    will-change: transform, opacity;
    animation: rise 780ms cubic-bezier(.16,1,.3,1) both;
  }
  .mark img {
    width: 100%; height: 100%; display: block;
    /* static, not animated — a drop-shadow that changes per frame is another
       re-rasterisation, and this reads the same held still */
    filter: drop-shadow(0 0 16px rgba(0,217,146,.4));
  }
  @keyframes rise {
    from { opacity: 0; transform: scale(.72) }
    to   { opacity: 1; transform: scale(1) }
  }

  /* light thrown as it lands — transform and opacity only */
  .bloom {
    position: absolute;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,217,146,.55) 0%, rgba(0,217,146,.14) 40%, transparent 70%);
    will-change: transform, opacity;
    animation: bloom 1000ms cubic-bezier(.16,1,.3,1) 120ms both;
  }
  @keyframes bloom {
    0%   { opacity: 0;  transform: scale(.5) }
    28%  { opacity: 1;  transform: scale(1.15) }
    100% { opacity: 0;  transform: scale(2.1) }
  }

  /* ── rings ─────────────────────────────────────────────────────────── */
  .ring {
    position: absolute;
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 1px solid rgba(0,217,146,.55);
    will-change: transform, opacity;
    animation: pass 1500ms cubic-bezier(.22,1,.36,1) 240ms both;
  }
  .ring.b {
    animation-delay: 620ms; animation-duration: 1800ms;
    border-color: rgba(0,217,146,.28);
  }
  @keyframes pass {
    0%   { opacity: 0;  transform: scale(.72) }
    16%  { opacity: .9 }
    100% { opacity: 0;  transform: scale(3.2) }
  }

  /* ── the radar arc ─────────────────────────────────────────────────── */
  .radar {
    position: absolute;
    width: 138px; height: 138px;
    will-change: transform, opacity;
    animation: turn 1600ms cubic-bezier(.42,0,.24,1) 520ms both;
  }
  .radar circle {
    fill: none; stroke: #00d992; stroke-width: 1; stroke-linecap: round;
    /* a short arc rather than a ring: it reads as something sweeping past */
    stroke-dasharray: 46 388;
  }
  @keyframes turn {
    0%   { opacity: 0;   transform: rotate(-90deg) }
    10%  { opacity: .9 }
    86%  { opacity: .9 }
    100% { opacity: 0;   transform: rotate(300deg) }
  }

  /* ── the word ──────────────────────────────────────────────────────── */
  .word {
    position: absolute; top: calc(50% + 76px);
    display: flex; gap: .34em;
    font-family: "Chakra Petch", "Segoe UI", sans-serif;
    font-size: 13px; font-weight: 700;
    color: #d7d8d9;
    text-shadow: 0 0 14px rgba(0,217,146,.45);
  }
  .word span {
    display: inline-block;
    will-change: transform, opacity;
    animation: land 560ms cubic-bezier(.16,1,.3,1) both;
  }
  .word span:nth-child(1) { animation-delay: 760ms }
  .word span:nth-child(2) { animation-delay: 815ms }
  .word span:nth-child(3) { animation-delay: 870ms }
  .word span:nth-child(4) { animation-delay: 925ms }
  .word span:nth-child(5) { animation-delay: 980ms }
  .word span:nth-child(6) { animation-delay: 1035ms }
  .word span:nth-child(7) { animation-delay: 1090ms }
  @keyframes land {
    from { opacity: 0;  transform: translateY(-6px) scale(1.4) }
    to   { opacity: .9; transform: none }
  }

  body.leaving .stage { animation: out 300ms cubic-bezier(.7,0,.84,0) both }
  @keyframes out { to { opacity: 0; transform: translateY(-10px) scale(.97) } }

  @media (prefers-reduced-motion: reduce) {
    .mark, .bloom, .ring, .radar, .word span { animation: none }
    .bloom, .ring, .radar { opacity: 0 }
    .mark { opacity: 1 } .word span { opacity: .9 }
  }
</style>
</head>
