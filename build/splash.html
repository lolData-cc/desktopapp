<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lolData</title>
<!--
  The boot animation.

  No panel, no card, no shadowed box. The window is transparent and the only
  things that exist are the mark and the motion around it — a container would be
  an arbitrary rectangle floating on the desktop, which is what an opening
  animation must not look like.

  The elaboration is all in the MOVEMENT rather than in added objects: rings
  that expand and pass, hairlines converging from the diagonals, an arc that
  sweeps once around, and the mark resolving through a bloom. Nothing on screen
  that is not either the logo or a trace of it arriving.

  Sequence, ~2.1s end to end:
    0ms    four hairlines run in from the diagonals
    260ms  the first ring passes outward
    340ms  the mark resolves — scale, unblur, bloom
    620ms  the sweep arc makes one turn
    700ms  a second, slower ring
    880ms  LOLDATA resolves letter by letter
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;      /* nothing behind anything */
    overflow: hidden;
    user-select: none; cursor: default;
    -webkit-app-region: drag;
  }
  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: grid; place-items: center;
  }

  /* ── the mark ──────────────────────────────────────────────────────── */
  .mark {
    position: relative;
    width: 96px; height: 96px;
    animation: resolve 900ms cubic-bezier(.16,1,.3,1) 340ms both;
  }
  .mark img { width: 100%; height: 100%; display: block; }
  @keyframes resolve {
    0%   { opacity: 0; transform: scale(.62); filter: blur(14px) brightness(2.4) saturate(.4) }
    45%  { opacity: 1; filter: blur(3px) brightness(1.5) saturate(.9) }
    100% { opacity: 1; transform: scale(1);  filter: blur(0)  brightness(1)   saturate(1) }
  }
  /* the light it throws while it lands, gone once it has */
  .mark::after {
    content: ""; position: absolute; inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,217,146,.5) 0%, rgba(0,217,146,.12) 38%, transparent 68%);
    animation: bloom 1100ms cubic-bezier(.16,1,.3,1) 340ms both;
    pointer-events: none;
  }
  @keyframes bloom {
    0%   { opacity: 0;  transform: scale(.4) }
    30%  { opacity: .95; transform: scale(1.05) }
    100% { opacity: 0;  transform: scale(1.5) }
  }

  /* ── rings that pass outward ───────────────────────────────────────── */
  .ring {
    position: absolute;
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 1px solid rgba(0,217,146,.55);
    animation: pass 1400ms cubic-bezier(.22,1,.36,1) both;
  }
  .ring.b { animation-delay: 700ms; animation-duration: 1700ms; border-color: rgba(0,217,146,.3) }
  .ring.a { animation-delay: 260ms }
  @keyframes pass {
    0%   { opacity: 0;  transform: scale(.7) }
    18%  { opacity: .9 }
    100% { opacity: 0;  transform: scale(3.1) }
  }

  /* ── hairlines converging from the diagonals ───────────────────────── */
  .tick {
    position: absolute;
    width: 54px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,217,146,.75));
    transform-origin: right center;
    animation: converge 820ms cubic-bezier(.16,1,.3,1) both;
  }
  .tick:nth-child(1) { transform: rotate(225deg) translateX(-96px) }
  .tick:nth-child(2) { transform: rotate(315deg) translateX(-96px) }
  .tick:nth-child(3) { transform: rotate(45deg)  translateX(-96px) }
  .tick:nth-child(4) { transform: rotate(135deg) translateX(-96px) }
  .tick:nth-child(2) { animation-delay: 60ms }
  .tick:nth-child(3) { animation-delay: 120ms }
  .tick:nth-child(4) { animation-delay: 180ms }
  @keyframes converge {
    0%   { opacity: 0; width: 4px }
    40%  { opacity: 1; width: 54px }
    100% { opacity: 0; width: 8px }
  }

  /* ── one sweep around the mark ─────────────────────────────────────── */
  .sweep {
    position: absolute;
    width: 132px; height: 132px;
    animation: turn 1500ms cubic-bezier(.45,0,.25,1) 620ms both;
  }
  .sweep circle {
    fill: none; stroke: #00d992; stroke-width: 1; stroke-linecap: round;
    /* a short arc, not a full ring: it reads as something passing */
    stroke-dasharray: 42 372;
  }
  @keyframes turn {
    0%   { opacity: 0;  transform: rotate(-90deg) }
    12%  { opacity: .85 }
    88%  { opacity: .85 }
    100% { opacity: 0;  transform: rotate(290deg) }
  }

  /* ── the word ──────────────────────────────────────────────────────── */
  .word {
    position: absolute;
    top: calc(50% + 74px);
    display: flex; gap: .34em;
    font-family: "Chakra Petch", "Segoe UI", sans-serif;
    font-size: 13px; font-weight: 700;
    color: #d7d8d9;
  }
  .word span {
    display: inline-block;
    animation: land 620ms cubic-bezier(.16,1,.3,1) both;
    text-shadow: 0 0 14px rgba(0,217,146,.45);
  }
  /* letters resolving one at a time rather than a word appearing */
  .word span:nth-child(1) { animation-delay: 880ms }
  .word span:nth-child(2) { animation-delay: 940ms }
  .word span:nth-child(3) { animation-delay: 1000ms }
  .word span:nth-child(4) { animation-delay: 1060ms }
  .word span:nth-child(5) { animation-delay: 1120ms }
  .word span:nth-child(6) { animation-delay: 1180ms }
  .word span:nth-child(7) { animation-delay: 1240ms }
  @keyframes land {
    0%   { opacity: 0; transform: translateY(-7px) scale(1.5); filter: blur(5px) }
    100% { opacity: .9; transform: none; filter: blur(0) }
  }

  /* leaves as one piece, upward — it is being replaced, not dismissed */
  body.leaving .stage { animation: out 300ms cubic-bezier(.7,0,.84,0) both }
  @keyframes out { to { opacity: 0; transform: translateY(-10px) scale(.97) } }

  @media (prefers-reduced-motion: reduce) {
    .mark, .mark::after, .ring, .tick, .sweep, .word span { animation: none }
    .ring, .tick, .sweep, .mark::after { opacity: 0 }
    .mark { opacity: 1 } .word span { opacity: .9 }
  }
</style>
</head>
