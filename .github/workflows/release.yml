# Build the installer and publish it as a GitHub Release.
#
# Tag-driven on purpose: pushing `v0.0.3` is the whole ritual, and the version
# people can download is then whatever the tag says rather than whatever was
# last built on somebody's laptop and remembered to be uploaded. That gap is
# the reason this exists.
name: release

on:
  push:
    tags: ["v*"]
  # So the build can be proven without cutting a release.
  workflow_dispatch:

permissions:
  # ⚠️ Needed to create the release. The default token is read-only, and
  # electron-builder's failure when it cannot publish comes at the very end,
  # after the whole build.
  contents: write

# Two runs publishing the same tag would race to create one release, and the
# loser fails after having built the whole installer. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ⚠️ Frozen. A CI build that resolves a different dependency tree than
      # the one committed is a build of something nobody has run.
      - run: bun install --frozen-lockfile

      - run: bun run build

      # Typechecked here rather than trusted: `bun run build` transpiles and
      # does not typecheck, so without this a type error ships.
      #
      # ⚠️ `bun run typecheck`, NOT `tsc -p tsconfig.json`. There are two bodies
      # of code here with two contracts: the app's own, checked strictly, and
      # the tree lifted byte-for-byte from the website, checked under the rules
      # it was written to. The strict config follows imports into the copy and
      # reports ~54 complaints about array indexing that are configuration
      # differences rather than defects — running it alone would fail every
      # release. See scripts/typecheck.ts.
      - run: bun run typecheck

      - name: Package and publish
        # Publishes only for a tag; a manual run builds and proves nothing is
        # broken without putting anything in front of anybody.
        run: bunx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          if-no-files-found: warn
